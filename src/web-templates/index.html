<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLI Manager</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .layout {
    display: grid;
    grid-template-columns: 256px 1fr;
    grid-template-rows: 52px 1fr;
    height: 100vh;
  }
  .header {
    grid-column: 1 / -1;
    background: rgba(255,255,255,0.72);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(0,0,0,0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
  .header .sub { color: #86868b; font-size: 12px; margin-left: 8px; font-weight: 400; }
  .sidebar {
    background: rgba(255,255,255,0.55);
    border-right: 1px solid rgba(0,0,0,0.06);
    padding: 14px 12px;
    overflow-y: auto;
  }
  .sidebar-section { margin-bottom: 18px; }
  .sidebar-title {
    font-size: 11px;
    text-transform: uppercase;
    color: #86868b;
    letter-spacing: 0.6px;
    font-weight: 600;
    margin-bottom: 6px;
    padding-left: 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 8px;
    color: #1d1d1f;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.12s;
  }
  .nav-item:hover { background: rgba(0,0,0,0.04); }
  .nav-item.active { background: #e8e8ed; color: #000; }
  .nav-item .icon { width: 18px; text-align: center; opacity: 0.7; }
  .main { padding: 18px 22px; overflow-y: auto; }
  .panel { display: none; }
  .panel.active { display: block; }

  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .search {
    flex: 1;
    min-width: 220px;
    height: 34px;
    padding: 0 12px;
    border-radius: 10px;
    border: 1px solid rgba(0,0,0,0.12);
    background: #fff;
    font-size: 13px;
    outline: none;
  }
  .search:focus { border-color: #007aff; box-shadow: 0 0 0 3px rgba(0,122,255,0.12); }
  select.pill {
    height: 34px;
    padding: 0 12px;
    border-radius: 10px;
    border: 1px solid rgba(0,0,0,0.12);
    background: #fff;
    font-size: 13px;
    color: #1d1d1f;
    cursor: pointer;
    outline: none;
  }
  select.pill:focus { border-color: #007aff; }

  .action-btn {
    height: 34px;
    padding: 0 16px;
    border-radius: 10px;
    border: none;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    color: #fff;
    background: #007aff;
    transition: opacity 0.12s;
  }
  .action-btn:hover { opacity: 0.88; }
  .action-btn.secondary { background: #e8e8ed; color: #1d1d1f; }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 12px;
    margin-bottom: 18px;
  }
  .stat {
    background: #fff;
    border-radius: 14px;
    padding: 14px 16px;
    border: 1px solid rgba(0,0,0,0.06);
    box-shadow: 0 1px 2px rgba(0,0,0,0.02);
  }
  .stat .label { font-size: 11px; color: #86868b; text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; }
  .stat .value { font-size: 24px; font-weight: 600; margin-top: 4px; letter-spacing: -0.5px; }
  .stat .sub { font-size: 12px; color: #86868b; margin-top: 2px; }

  .section {
    background: #fff;
    border-radius: 14px;
    border: 1px solid rgba(0,0,0,0.06);
    box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    margin-bottom: 16px;
    overflow: hidden;
  }
  .section-header {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    font-weight: 600;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    text-align: left;
    padding: 9px 12px;
    color: #86868b;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    background: #fbfbfd;
    border-bottom: 1px solid rgba(0,0,0,0.05);
  }
  td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(0,0,0,0.04);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f5f5f7; }

  .tag {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    background: #e8e8ed;
    color: #3a3a3c;
    margin: 2px;
  }
  .tag.system { background: #fde7e7; color: #c0392b; }
  .tag.npm { background: #e8f5e9; color: #27ae60; }
  .tag.pip { background: #e3f2fd; color: #1565c0; }
  .tag.scoop { background: #fff3e0; color: #ef6c00; }
  .tag.winget { background: #f3e5f5; color: #7b1fa2; }
  .tag.choco { background: #fce4ec; color: #c2185b; }
  .tag.gh { background: #ede7f6; color: #512da8; }
  .tag.manual { background: #f5f5f5; color: #616161; }

  .source-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    text-transform: capitalize;
  }

  .badge {
    background: #e8e8ed;
    color: #1d1d1f;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
  }
  .btn-xs {
    background: #e8e8ed;
    border: none;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    color: #1d1d1f;
    font-weight: 500;
  }
  .btn-xs:hover { background: #dcdce0; }
  .btn-xs.primary { background: #007aff; color: #fff; }
  .btn-xs.primary:hover { background: #0062c4; }
  .btn-xs.danger { background: #ffe5e5; color: #c0392b; }
  .btn-xs.danger:hover { background: #fdd; }

  .empty {
    text-align: center;
    padding: 40px 20px;
    color: #86868b;
    font-size: 13px;
  }

  .toast {
    position: fixed;
    top: 16px;
    right: 16px;
    background: rgba(29,29,31,0.86);
    color: #fff;
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 13px;
    backdrop-filter: blur(10px);
    display: none;
    z-index: 100;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  }
  input[type="checkbox"] { accent-color: #007aff; width: 15px; height: 15px; }
  .view-toggle { display: inline-flex; gap: 2px; background: #e8e8ed; border-radius: 10px; padding: 2px; }
  .view-toggle button {
    border: none;
    background: transparent;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    color: #636366;
  }
  .view-toggle button.active { background: #fff; color: #000; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  .tagfilter { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
  .tagfilter button {
    border: 1px solid rgba(0,0,0,0.08);
    background: #fff;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.12s;
  }
  .tagfilter button:hover { background: #f5f5f7; }
  .tagfilter button.active { background: #007aff; color: #fff; border-color: #007aff; }

  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.36);
    z-index: 200;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal.show { display: flex; }
  .modal-body {
    background: #fff;
    border-radius: 16px;
    padding: 22px;
    width: 92%;
    max-width: 640px;
    max-height: 78vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .modal header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .modal header h3 { font-size: 16px; font-weight: 600; }
  .modal-close {
    background: #e8e8ed;
    border: none;
    width: 28px; height: 28px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .tags-input-wrap { display: flex; gap: 6px; align-items: center; margin-top: 10px; }
  .tags-input-wrap input {
    flex: 1; height: 32px; padding: 0 10px; border-radius: 8px;
    border: 1px solid rgba(0,0,0,0.12); font-size: 13px;
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 768px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
  }
</style>
</head>
<body>
<div class="layout">
  <header class="header">
    <div style="display:flex;align-items:center;gap:8px;">
      <h1>CLI Manager</h1>
      <span class="sub" id="toolCountBadge">-</span>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <span id="loadingIndicator" style="color:#86868b;font-size:12px;">就绪</span>
      <button class="action-btn secondary" onclick="loadData()" style="height:30px;padding:0 12px;font-size:12px;">刷新</button>
    </div>
  </header>

  <nav class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">导航</div>
      <div class="nav-item active" onclick="switchTab('dashboard', this)"><span class="icon">⊞</span>仪表盘</div>
      <div class="nav-item" onclick="switchTab('tools', this)"><span class="icon">☰</span>工具</div>
      <div class="nav-item" onclick="switchTab('environment', this)"><span class="icon">🌐</span>环境</div>
      <div class="nav-item" onclick="switchTab('recipes', this)"><span class="icon">📦</span>配方</div>
      <div class="nav-item" onclick="switchTab('config', this)"><span class="icon">⚙️</span>配置</div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">视图</div>
      <div class="nav-item" onclick="setView('list')"><span class="icon">☰</span>列表视图</div>
      <div class="nav-item" onclick="setView('card')"><span class="icon">⊞</span>卡片视图</div>
      <div class="nav-item" onclick="setView('compact')"><span class="icon">≡</span>紧凑视图</div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">统计</div>
      <div id="sidebarStats" style="font-size:12px;color:#636366;"></div>
    </div>
  </nav>

  <main class="main">
    <!-- 仪表盘 -->
    <section id="tab-dashboard" class="panel active">
      <div class="stats" id="statsCards"></div>
      <div class="section">
        <div class="section-header">快捷操作</div>
        <div style="padding:12px;display:flex;gap:10px;flex-wrap:wrap;">
          <button class="action-btn" onclick="triggerScan()">扫描工具</button>
          <button class="action-btn secondary" onclick="triggerBackup()">导出备份</button>
          <button class="action-btn secondary" onclick="switchTab('tools', document.querySelectorAll('.nav-item')[1])">查看全部</button>
          <button class="action-btn secondary" onclick="switchTab('recipes', document.querySelectorAll('.nav-item')[3])">浏览配方</button>
        </div>
      </div>
      <div class="section">
        <div class="section-header">来源 / 分类</div>
        <div style="padding:12px;">
          <div id="sourceBars"></div>
          <div id="categoryBars" style="margin-top:10px;"></div>
        </div>
      </div>
      <div class="section">
        <div class="section-header">最近扫描</div>
        <table>
          <thead><tr><th>时间</th><th>类型</th><th>耗时</th><th>结果</th></tr></thead>
          <tbody id="historyTable"><tr><td colspan="4" class="empty">加载中...</td></tr></tbody>
        </table>
      </div>
    </section>

    <!-- 工具 -->
    <section id="tab-tools" class="panel">
      <div class="toolbar">
        <input class="search" id="search" placeholder="搜索名称、路径或标签..." oninput="filterTools()">
        <select class="pill" id="sourceFilter" onchange="filterTools()">
          <option value="">所有来源</option>
          <option value="system">system</option>
          <option value="npm">npm</option>
          <option value="pip">pip</option>
          <option value="scoop">scoop</option>
          <option value="winget">winget</option>
          <option value="choco">choco</option>
          <option value="gh">gh</option>
          <option value="manual">manual</option>
        </select>
        <select class="pill" id="categoryFilter" onchange="filterTools()">
          <option value="">所有分类</option>
          <option value="dev">dev</option>
          <option value="ai">ai</option>
          <option value="system">system</option>
          <option value="editor">editor</option>
          <option value="other">other</option>
        </select>
        <select class="pill" id="sortBy" onchange="filterTools()">
          <option value="name">按名称</option>
          <option value="source">按来源</option>
          <option value="size">按大小</option>
          <option value="version">按版本</option>
        </select>
        <div class="view-toggle">
          <button class="active" onclick="setView('list', this)">列表</button>
          <button onclick="setView('card', this)">卡片</button>
          <button onclick="setView('compact', this)">紧凑</button>
        </div>
      </div>
      <div style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">
        <div style="color:#86868b;font-size:12px;">共 <span id="filteredCount">0</span> 个工具 <span class="link-btn" onclick="exportCurrentList()" style="margin-left:8px;">导出 JSON</span></div>
        <div id="tagFilter" class="tagfilter"></div>
      </div>
      <div class="section" style="padding:0;">
        <div id="toolsContainer"></div>
      </div>
    </section>

    <!-- 环境 -->
    <section id="tab-environment" class="panel">
      <div class="section"><div class="section-header">运行时状态</div><div id="runtimeList" style="padding:10px 14px;"></div></div>
      <div class="section"><div class="section-header">PATH 环境变量</div><div id="pathList" style="max-height:360px;overflow-y:auto;padding:8px 14px;"></div></div>
      <div class="section"><div class="section-header">系统信息</div><div id="systemInfo" style="padding:10px 14px;"></div></div>
    </section>

    <!-- 配方 -->
    <section id="tab-recipes" class="panel">
      <div class="toolbar">
        <input class="search" id="recipeSearch" placeholder="搜索配方..." oninput="filterRecipes()">
        <select class="pill" id="recipeCatFilter" onchange="filterRecipes()">
          <option value="">所有分类</option>
          <option value="dev">dev</option>
          <option value="ai">ai</option>
          <option value="system">system</option>
          <option value="editor">editor</option>
          <option value="other">other</option>
        </select>
      </div>
      <div class="stats" id="recipeGrid" style="grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));"></div>
    </section>

    <!-- 配置 -->
    <section id="tab-config" class="panel">
      <div class="section" style="max-width:720px;">
        <div class="section-header">配置</div>
        <div id="configForm" style="padding:14px 16px;"></div>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="toolDetailModal">
  <div class="modal-body">
    <header>
      <h3 id="modalTitle">工具详情</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </header>
    <div id="modalContent"></div>
  </div>
</div>

<script>
var allTools = [];
var allRecipes = [];
var currentView = 'list';
var currentTagFilter = '';

function switchTab(tabId, el) {
  document.querySelectorAll('.panel').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.nav-item').forEach(function(t) { t.classList.remove('active'); });
  document.getElementById('tab-' + tabId).classList.add('active');
  if (el) el.classList.add('active');
}

function setView(view, el) {
  currentView = view;
  document.querySelectorAll('.view-toggle button').forEach(function(b) { b.classList.remove('active'); });
  if (el) el.classList.add('active');
  else {
    var btns = document.querySelectorAll('.view-toggle button');
    if (btns[0]) btns[0].classList.add('active');
  }
  renderTools(getFilteredTools());
}

function getFilteredTools() {
  var search = (document.getElementById('search').value || '').toLowerCase();
  var source = document.getElementById('sourceFilter').value;
  var category = document.getElementById('categoryFilter').value;
  var sortBy = document.getElementById('sortBy').value;
  var filtered = allTools.filter(function(t) {
    var hay = (t.name + ' ' + t.fullPath + ' ' + (t.tags || '')).toLowerCase();
    if (search && hay.indexOf(search) === -1) return false;
    if (source && t.source !== source) return false;
    if (category && t.category !== category) return false;
    if (currentTagFilter && (!t.tags || t.tags.split(',').map(function(s){return s.trim();}).indexOf(currentTagFilter) === -1)) return false;
    return true;
  });
  if (sortBy === 'name') filtered.sort(function(a, b) { return a.name.localeCompare(b.name); });
  else if (sortBy === 'size') filtered.sort(function(a, b) { return b.fileSize - a.fileSize; });
  else if (sortBy === 'source') filtered.sort(function(a, b) { return a.source.localeCompare(b.source); });
  else if (sortBy === 'version') filtered.sort(function(a, b) { return ((b.version || 'z')).localeCompare(a.version || 'z'); });
  return filtered;
}

function parseTags(t) { return (t.tags || '').split(',').map(function(s){return s.trim();}).filter(Boolean); }

function getAllTags() {
  var m = {};
  allTools.forEach(function(t) { parseTags(t).forEach(function(tag) { m[tag] = (m[tag]||0) + 1; }); });
  return Object.entries(m).sort(function(a,b){return b[1]-a[1];}).slice(0, 40);
}

function renderTagFilter() {
  var el = document.getElementById('tagFilter');
  var tags = getAllTags();
  if (!tags.length) { el.innerHTML = ''; return; }
  el.innerHTML = '<button class="' + (currentTagFilter===''?'active':'') + '" onclick="setTagFilter(\'\')">全部</button>' +
    tags.map(function(e) { return '<button class="' + (currentTagFilter===e[0]?'active':'') + '" onclick="setTagFilter(\'' + escapeAttr(e[0]) + '\')">' + escapeHtml(e[0]) + ' ' + e[1] + '</button>'; }).join('');
}
function setTagFilter(tag) { currentTagFilter = tag; renderTagFilter(); filterTools(); }

function renderTools(tools) {
  document.getElementById('filteredCount').textContent = tools.length;
  var container = document.getElementById('toolsContainer');
  if (tools.length === 0) {
    container.innerHTML = '<div class="empty">没有匹配的工具</div>';
    return;
  }
  if (currentView === 'list') renderListView(container, tools);
  else if (currentView === 'card') renderCardView(container, tools);
  else renderCompactView(container, tools);
}

function renderListView(container, tools) {
  var rows = tools.slice(0, 300).map(function(t) {
    var tagsHtml = parseTags(t).map(function(tag) { return '<span class="tag ' + t.source + '">' + escapeHtml(tag) + '</span>'; }).join('');
    var ver = t.version ? escapeHtml(t.version) : '<span style="color:#86868b;">-</span>';
    var actions = '<button class="btn-xs" onclick="event.stopPropagation();pinTool(\'' + t.id + '\')">锁定</button>' +
      '<button class="btn-xs danger" onclick="event.stopPropagation();unpinTool(\'' + t.id + '\')" style="margin-left:4px;">解锁</button>' +
      '<button class="btn-xs primary" onclick="event.stopPropagation();showToolDetail(\'' + t.id + '\')" style="margin-left:4px;">详情</button>';
    return '<tr onclick="showToolDetail(\'' + t.id + '\')" style="cursor:pointer;">' +
      '<td><strong>' + escapeHtml(t.name) + '</strong><div style="margin-top:4px;">' + tagsHtml + '</div></td>' +
      '<td style="color:#636366;font-size:12px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + escapeHtml(t.fullPath) + '">' + escapeHtml(t.fullPath) + '</td>' +
      '<td style="white-space:nowrap;">' + ver + '</td>' +
      '<td><span class="source-tag" style="background:' + sourceColor(t.source) + '22;color:' + sourceColor(t.source) + ';">' + t.source + '</span></td>' +
      '<td>' + t.category + '</td>' +
      '<td style="color:#86868b;white-space:nowrap;">' + formatSize(t.fileSize) + '</td>' +
      '<td style="white-space:nowrap;">' + actions + '</td></tr>';
  }).join('');
  container.innerHTML = '<table><thead><tr><th>名称 / 标签</th><th>路径</th><th>版本</th><th>来源</th><th>分类</th><th>大小</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

function renderCardView(container, tools) {
  var cards = tools.slice(0, 200).map(function(t) {
    var tagsHtml = parseTags(t).map(function(tag) { return '<span class="tag ' + t.source + '">' + escapeHtml(tag) + '</span>'; }).join('');
    var ver = t.version || '<span style="color:#86868b;">未知</span>';
    return '<div style="background:#fff;border:1px solid rgba(0,0,0,0.06);border-radius:14px;padding:14px 16px;cursor:pointer;" onclick="showToolDetail(\'' + t.id + '\')">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">' +
        '<div><strong style="font-size:14px;">' + escapeHtml(t.name) + '</strong><div style="margin-top:6px;">' + tagsHtml + '</div></div>' +
        '<span style="font-size:12px;color:#636366;white-space:nowrap;">' + ver + '</span>' +
      '</div>' +
      '<div style="color:#86868b;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escapeHtml(t.fullPath) + '</div>' +
      '<div style="margin-top:8px;display:flex;gap:6px;justify-content:flex-end;">' +
        '<button class="btn-xs" onclick="event.stopPropagation();pinTool(\'' + t.id + '\')">锁定</button>' +
        '<button class="btn-xs primary" onclick="event.stopPropagation();showToolDetail(\'' + t.id + '\')">详情</button>' +
      '</div></div>';
  }).join('');
  container.innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;">' + cards + '</div>';
}

function renderCompactView(container, tools) {
  var rows = tools.slice(0, 400).map(function(t) {
    var tags = parseTags(t).map(function(tag) { return '<span class="tag ' + t.source + '" style="font-size:10px;padding:0 6px;">' + escapeHtml(tag) + '</span>'; }).join(' ');
    var ver = t.version || '-';
    return '<div style="display:grid;grid-template-columns:1fr 80px 60px 90px;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid rgba(0,0,0,0.04);cursor:pointer;" onclick="showToolDetail(\'' + t.id + '\')">' +
      '<div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><strong>' + escapeHtml(t.name) + '</strong> ' + tags + '</div>' +
      '<div style="color:#636366;font-size:12px;text-align:right;">' + formatSize(t.fileSize) + '</div>' +
      '<div style="font-size:12px;text-align:right;">' + escapeHtml(ver) + '</div>' +
      '<div style="text-align:right;"><span class="source-tag" style="background:' + sourceColor(t.source) + '22;color:' + sourceColor(t.source) + ';">' + t.source + '</span></div>' +
    '</div>';
  }).join('');
  container.innerHTML = rows;
}

function sourceColor(s) {
  var map = { system:'#c0392b', npm:'#27ae60', pip:'#1565c0', scoop:'#ef6c00', winget:'#7b1fa2', choco:'#c2185b', gh:'#512da8', manual:'#616161' };
  return map[s] || '#636366';
}

function filterTools() {
  renderTools(getFilteredTools());
  renderTagFilter();
}

function renderDashboard(stats, health, term, history, config) {
  document.getElementById('statsCards').innerHTML = [
    statCard('工具总数', stats.total || 0, '#007aff'),
    statCard('锁定版本', stats.pinned || 0, '#ff9500'),
    statCard('版本未知', stats.noVersion || 0, '#ff3b30'),
    statCard('磁盘占用', formatSize(stats.totalSize || 0), '#34c759')
  ].join('');
  var healthItems = [];
  if (health.issues) health.issues.forEach(function(i){ healthItems.push({icon:'✗',color:'#ff3b30',text:i}); });
  if (health.warnings) health.warnings.forEach(function(w){ healthItems.push({icon:'⚠',color:'#ff9500',text:w}); });
  healthItems = healthItems.slice(0, 5);
  document.getElementById('sidebarStats').innerHTML =
    '<div>Pinned: ' + (stats.pinned||0) + '</div>' +
    '<div>No version: ' + (stats.noVersion||0) + '</div>' +
    '<div>IDs: ' + (stats.total||0) + '</div>';
}

function statCard(label, value, color) {
  return '<div class="stat"><div class="label">' + escapeHtml(label) + '</div><div class="value" style="color:' + color + ';">' + escapeHtml(String(value)) + '</div></div>';
}

function renderEnvironment(pathData, term) {
  if (term.runtimes) {
    document.getElementById('runtimeList').innerHTML = term.runtimes.map(function(r) {
      var icon = r.available ? '✓' : '✗';
      var c = r.available ? '#34c759' : '#ff3b30';
      return '<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(0,0,0,0.04);"><span>' + escapeHtml(r.name) + '</span><span style="color:' + c + ';font-weight:500;">' + icon + ' ' + (r.available ? '可用' : '未找到') + '</span></div>';
    }).join('');
  }
  if (pathData.dirs) {
    var html = '';
    for (var i = 0; i < Math.min(pathData.dirs.length, 40); i++) {
      var d = pathData.dirs[i];
      html += '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(0,0,0,0.03);"><span style="color:' + (d.exists ? '#34c759' : '#ff3b30') + ';">' + (d.exists ? '✓' : '✗') + '</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + escapeHtml(d.path) + '">' + escapeHtml(d.path) + '</span></div>';
    }
    document.getElementById('pathList').innerHTML = html;
  }
  if (term.hostname) {
    document.getElementById('systemInfo').innerHTML =
      '<div style="display:grid;grid-template-columns:90px 1fr;gap:6px 12px;font-size:13px;">' +
        row('主机名', term.hostname) + row('平台', term.platform) + row('PATH 条目', pathData.total || 0) +
      '</div>';
  }
}

function renderRecipes(recipes) {
  document.getElementById('recipeGrid').innerHTML = recipes.map(function(r) {
    var src = (r.sources || []).map(function(s) { return typeof s === 'object' && s ? s.type : (s || ''); }).filter(Boolean).map(function(t){ return '<span class="tag ' + t + '">' + t + '</span>'; }).join(' ');
    return '<div style="background:#fff;border:1px solid rgba(0,0,0,0.06);border-radius:14px;padding:14px 16px;">' +
      '<div style="font-weight:600;font-size:14px;margin-bottom:4px;">' + escapeHtml(r.displayName || r.name) + '</div>' +
      '<div style="color:#86868b;font-size:12px;margin-bottom:8px;">' + escapeHtml(r.description || '') + '</div>' +
      '<div style="margin-bottom:10px;">' + src + '</div>' +
      '<div style="display:flex;gap:8px;"><button class="action-btn" style="flex:1;height:30px;font-size:12px;" onclick="installRecipe(\'' + escapeAttr(r.name) + '\')">安装</button>' +
      '<button class="action-btn secondary" style="flex:1;height:30px;font-size:12px;" onclick="showToast(\'recipe show ' + escapeAttr(r.name) + '\')">详情</button></div></div>';
  }).join('');
}
function filterRecipes() {
  var s = (document.getElementById('recipeSearch').value || '').toLowerCase();
  var c = document.getElementById('recipeCatFilter').value;
  var f = allRecipes.filter(function(r) {
    if (s && ((r.name + ' ' + r.displayName).toLowerCase().indexOf(s) === -1)) return false;
    if (c && r.category !== c) return false;
    return true;
  });
  renderRecipes(f);
}

function renderConfig(config) {
  var fields = [
    { key: 'scanInterval', label: '扫描频率', options: ['daily','weekly','manual'] },
    { key: 'defaultFormat', label: '输出格式', options: ['table','json','text'] },
    { key: 'colorEnabled', label: '彩色输出', options: ['true','false'] },
    { key: 'autoUpdateCheck', label: '自动检查更新', options: ['true','false'] },
  ];
  document.getElementById('configForm').innerHTML = '<h3 style="margin-bottom:10px;font-size:15px;">配置</h3>' +
    fields.map(function(f) {
      var opts = f.options.map(function(o) { return '<option value="' + o + '" ' + (String(config[f.key])===o?'selected':'') + '>' + o + '</option>'; }).join('');
      return '<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(0,0,0,0.06);"><label style="font-size:13px;">' + f.label + '</label><select class="pill" onchange="updateConfig(\'' + f.key + '\', this.value)">' + opts + '</select></div>';
    }).join('');
}
function updateConfig(key, value) {
  showToast('正在保存...');
  fetch('/api/config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ [key]: value }),
  }).then(function(r){ return r.json(); }).then(function(d){ showToast(d.message || '已保存'); setTimeout(loadData, 400); }).catch(function(e){ showToast('保存失败'); });
}

function pinTool(id) {
  var v = prompt('锁定版本（留空为当前版本）：', '');
  if (v === null) return;
  fetch('/api/tools/' + encodeURIComponent(id) + '/pin', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({version: v || undefined}) })
    .then(function(r){ return r.json(); }).then(function(d){ showToast(d.message); loadData(); }).catch(function(e){ showToast('锁定失败'); });
}
function unpinTool(id) {
  if (!confirm('确定解锁？')) return;
  fetch('/api/tools/' + encodeURIComponent(id) + '/unpin', { method:'POST' })
    .then(function(r){ return r.json(); }).then(function(d){ showToast(d.message); loadData(); }).catch(function(e){ showToast('解锁失败'); });
}
function showToolDetail(id) {
  var modal = document.getElementById('toolDetailModal');
  var content = document.getElementById('modalContent');
  modal.classList.add('show');
  content.innerHTML = '<div style="color:#86868b;padding:20px;">加载中...</div>';
  fetch('/api/tools/' + encodeURIComponent(id)).then(function(r){ return r.json(); }).then(function(data) {
    var t = data.tool;
    var hist = '';
    if (data.versionHistory && data.versionHistory.length) {
      hist = '<h4 style="margin:14px 0 8px;font-size:13px;">版本变更</h4><table style="font-size:12px;"><thead><tr><th>时间</th><th>操作</th><th>旧版本</th><th>新版本</th></tr></thead><tbody>' +
        data.versionHistory.map(function(h){ return '<tr><td style="color:#86868b;white-space:nowrap;">' + new Date(h.operatedAt).toLocaleString('zh-CN') + '</td><td>' + h.operation + '</td><td>' + (h.previousVersion||'-') + '</td><td>' + (h.newVersion||'-') + '</td></tr>'; }).join('') + '</tbody></table>';
    }
    content.innerHTML =
      '<div class="grid-2" style="gap:8px 16px;font-size:13px;">' +
        row('名称', t.name) + row('版本', t.version || '未知') + row('来源', t.source) + row('分类', t.category) +
        row('文件大小', formatSize(t.fileSize)) + row('修改时间', new Date(t.modifiedAt).toLocaleString('zh-CN')) +
        row('锁定', t.isPinned ? '🔒 ' + (t.pinnedVersion || '当前') : '未锁定') +
      '</div>' +
      '<div style="margin-top:10px;"><strong>标签：</strong>' + parseTags(t).map(function(tag){ return '<span class="tag ' + t.source + '">' + escapeHtml(tag) + '</span>'; }).join(' ') + ' <button class="btn-xs" onclick="editTags(\'' + t.id + '\')">编辑</button></div>' +
      '<div style="margin-top:8px;color:#86868b;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + escapeHtml(t.fullPath) + '">' + escapeHtml(t.fullPath) + '</div>' + hist;
  }).catch(function(e){ content.innerHTML = '<div style="color:#ff3b30;">加载失败</div>'; });
}
function closeModal() { document.getElementById('toolDetailModal').classList.remove('show'); }
document.getElementById('toolDetailModal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

function editTags(id) {
  var tool = allTools.find(function(t){ return t.id === id; });
  if (!tool) return;
  var v = prompt('编辑标签（逗号分隔）：', tool.tags || '');
  if (v === null) return;
  fetch('/api/tools/' + encodeURIComponent(id) + '/tags', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tags: v }),
  }).then(function(r){ return r.json(); }).then(function(d){ showToast(d.message); loadData(); }).catch(function(){ showToast('保存失败'); });
}

function triggerScan() { showToast('触发扫描...'); fetch('/api/actions/scan', {method:'POST'}).then(function(){ showToast('已提交，3秒后刷新'); setTimeout(loadData, 3000); }); }
function triggerBackup() { fetch('/api/actions/backup',{method:'POST'}).then(function(r){return r.json();}).then(function(d){ showToast(d.message); }); }
function installRecipe(name) { showToast('安装 ' + name + '...'); fetch('/api/actions/install',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,from:'recipe'})}).then(function(){ showToast('已提交'); setTimeout(loadData,2000); }); }
function exportCurrentList() {
  var list = getFilteredTools();
  var blob = new Blob([JSON.stringify(list,null,2)], {type:'application/json'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'tools.json'; a.click(); URL.revokeObjectURL(a.href);
  showToast('已导出 ' + list.length + ' 个工具');
}

function row(k, v) { return '<div><span style="color:#86868b;">' + escapeHtml(k) + '</span><div>' + escapeHtml(v) + '</div></div>'; }

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(function(){ t.style.display = 'none'; }, 2400);
}

function formatSize(b) {
  if (!b && b !== 0) return '-';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  if (b < 1073741824) return (b/1048576).toFixed(1) + ' MB';
  return (b/1073741824).toFixed(1) + ' GB';
}

function escapeHtml(s) { if (!s) return ''; return String(s).replace(/[&<>"']/g, function(m){ var map={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}; return map[m]||m; }); }
function escapeAttr(s) { if (!s) return ''; return String(s).replace(/'/g,'&#39;').replace(/"/g,'&quot;'); }

function loadData() {
  var el = document.getElementById('loadingIndicator');
  if (el) el.textContent = '刷新中...';
  Promise.all([
    fetch('/api/tools'), fetch('/api/stats'), fetch('/api/health'), fetch('/api/recipes'), fetch('/api/path'), fetch('/api/terminal'), fetch('/api/config'), fetch('/api/history?limit=6')
  ]).then(function(res){ return Promise.all(res.map(function(r){return r.json();})); }).then(function(data) {
    var toolsData=data[0], stats=data[1], health=data[2], recipesData=data[3], pathData=data[4], term=data[5], config=data[6], historyData=data[7];
    allTools = toolsData.tools || []; allRecipes = recipesData.recipes || [];
    renderDashboard(stats, health, term, historyData.history, config);
    renderTools(getFilteredTools());
    renderTagFilter();
    renderRecipes(allRecipes);
    renderEnvironment(pathData, term);
    renderConfig(config);
    document.getElementById('toolCountBadge').textContent = (stats.total||0) + ' 个工具';
    if (el) el.textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN');
  }).catch(function(err){ showToast('加载失败: ' + err); if (el) el.textContent = '加载失败'; });
}
loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
